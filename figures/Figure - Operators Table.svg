<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2185" viewBox="0 0 2400 2185" font-family="DejaVu Sans" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="2400" height="1492" fill="#ffffff"/>
<text x="180" y="62" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="3.5">THE FORMULA</text>
<text x="180" y="120" font-size="46" fill="#111111" font-weight="700">Operators: The Eight</text>
<text x="180" y="164" font-size="25" fill="#5f5f5f">What joins two operands or acts on one, how to tell which holds, and what each is needed for. Set out in full in Figure 12.</text>
<line x1="180" y1="196" x2="2220" y2="196" stroke="#111111" stroke-width="3"/>
<text x="180" y="252" font-size="23" fill="#8f2f24">The bond carries information the operands do not, so a term that names only its ingredients has recorded half of itself. Which one holds is</text>
<text x="180" y="282" font-size="23" fill="#8f2f24">not recoverable from the operands, and seven yes-or-no tests separate the eight named here.</text>
<text x="180" y="342" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="2">OP.</text>
<text x="300" y="342" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="2">NAME</text>
<text x="700" y="342" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="2">MEANS</text>
<text x="1250" y="342" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="2">SYM.</text>
<text x="1400" y="342" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="2">THE TEST THAT IDENTIFIES IT</text>
<line x1="180" y1="360" x2="2220" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<rect x="180" y="386" width="2040" height="84" fill="#fafaf8"/>
<text x="180" y="420" font-size="27" fill="#1a1a1a" font-weight="600">+</text>
<text x="300" y="420" font-size="24" fill="#1a1a1a" font-weight="600">conjunction</text>
<text x="700" y="420" font-size="22" fill="#454545">both hold at once</text>
<text x="1250" y="420" font-size="22" fill="#1a7f5a" font-weight="600">yes</text>
<text x="1400" y="420" font-size="22" fill="#454545">swap the operands. Does the meaning change? No.</text>
<text x="300" y="450" font-size="21" fill="#7a7a72" font-style="italic">the only bond in a flat formula, which is why a formula records ingredients and not arrangement</text>
<line x1="180" y1="470" x2="2220" y2="470" stroke="#ececea" stroke-width="1.5"/>
<text x="180" y="504" font-size="27" fill="#1a1a1a" font-weight="600">&#8741;</text>
<text x="300" y="504" font-size="24" fill="#1a1a1a" font-weight="600">disjunction</text>
<text x="700" y="504" font-size="22" fill="#454545">either suffices; not both required</text>
<text x="1250" y="504" font-size="22" fill="#1a7f5a" font-weight="600">yes</text>
<text x="1400" y="504" font-size="22" fill="#454545">remove one. Does it still work? Yes.</text>
<text x="300" y="534" font-size="21" fill="#7a7a72" font-style="italic">not concurrency. Two things running in parallel both matter; remove one and it breaks, which is +</text>
<line x1="180" y1="554" x2="2220" y2="554" stroke="#ececea" stroke-width="1.5"/>
<rect x="180" y="554" width="2040" height="84" fill="#fafaf8"/>
<text x="180" y="588" font-size="27" fill="#1a1a1a" font-weight="600">&#8801;</text>
<text x="300" y="588" font-size="24" fill="#1a1a1a" font-weight="600">identity</text>
<text x="700" y="588" font-size="22" fill="#454545">two names, one referent</text>
<text x="1250" y="588" font-size="22" fill="#1a7f5a" font-weight="600">yes</text>
<text x="1400" y="588" font-size="22" fill="#454545">substitute one for the other. Is anything lost? No.</text>
<text x="300" y="618" font-size="21" fill="#7a7a72" font-style="italic">a definitional identity is not a recipe at all, which is where this glyph does two jobs</text>
<line x1="180" y1="638" x2="2220" y2="638" stroke="#ececea" stroke-width="1.5"/>
<text x="180" y="672" font-size="27" fill="#1a1a1a" font-weight="600">&#8594;</text>
<text x="300" y="672" font-size="24" fill="#1a1a1a" font-weight="600">sequence</text>
<text x="700" y="672" font-size="22" fill="#454545">A then B; B needs A to have happened</text>
<text x="1250" y="672" font-size="22" fill="#8f2f24" font-weight="600">no</text>
<text x="1400" y="672" font-size="22" fill="#454545">swap them. Does it become a different thing? Yes.</text>
<text x="300" y="702" font-size="21" fill="#7a7a72" font-style="italic">the only bond a flat chain can express, so every term today is a sequence whether or not it should be</text>
<line x1="180" y1="722" x2="2220" y2="722" stroke="#ececea" stroke-width="1.5"/>
<rect x="180" y="722" width="2040" height="84" fill="#fafaf8"/>
<text x="180" y="756" font-size="27" fill="#1a1a1a" font-weight="600">&#8658;</text>
<text x="300" y="756" font-size="24" fill="#1a1a1a" font-weight="600">production</text>
<text x="700" y="756" font-size="22" fill="#454545">A produces B; B did not exist before</text>
<text x="1250" y="756" font-size="22" fill="#8f2f24" font-weight="600">no</text>
<text x="1400" y="756" font-size="22" fill="#454545">is there a B before A fires? No.</text>
<text x="300" y="786" font-size="21" fill="#7a7a72" font-style="italic">different from sequence: the second operand is not waiting, it is absent until the first fires</text>
<line x1="180" y1="806" x2="2220" y2="806" stroke="#ececea" stroke-width="1.5"/>
<text x="180" y="840" font-size="27" fill="#1a1a1a" font-weight="600">&#8722;</text>
<text x="300" y="840" font-size="24" fill="#1a1a1a" font-weight="600">subtraction</text>
<text x="700" y="840" font-size="22" fill="#454545">A with B removed or absent</text>
<text x="1250" y="840" font-size="22" fill="#8f2f24" font-weight="600">no</text>
<text x="1400" y="840" font-size="22" fill="#454545">is the second operand&#8217;s absence the point? Yes.</text>
<text x="300" y="870" font-size="21" fill="#7a7a72" font-style="italic">progress is a subtraction, which is why a vocabulary without it cannot say how far along it is</text>
<line x1="180" y1="890" x2="2220" y2="890" stroke="#ececea" stroke-width="1.5"/>
<rect x="180" y="890" width="2040" height="84" fill="#fafaf8"/>
<text x="180" y="924" font-size="27" fill="#1a1a1a" font-weight="600">&#8923;</text>
<text x="300" y="924" font-size="24" fill="#1a1a1a" font-weight="600">comparison</text>
<text x="700" y="924" font-size="22" fill="#454545">a threshold relation between two quantities</text>
<text x="1250" y="924" font-size="22" fill="#8f2f24" font-weight="600">no</text>
<text x="1400" y="924" font-size="22" fill="#454545">is it about which is larger, rather than both being present? Yes.</text>
<text x="300" y="954" font-size="21" fill="#7a7a72" font-style="italic">a goal is a comparison, which is why a vocabulary without it cannot state one</text>
<line x1="180" y1="974" x2="2220" y2="974" stroke="#ececea" stroke-width="1.5"/>
<text x="180" y="1008" font-size="27" fill="#8a2a1e" font-weight="600">&#172;</text>
<text x="300" y="1008" font-size="24" fill="#1a1a1a" font-weight="600">negation</text>
<text x="700" y="1008" font-size="22" fill="#454545">this does not hold</text>
<text x="1250" y="1008" font-size="22" fill="#8a8a80" font-weight="600">&#8212;</text>
<text x="1400" y="1008" font-size="22" fill="#454545">is the point that it is false, rather than absent? Yes.</text>
<text x="300" y="1038" font-size="21" fill="#7a7a72" font-style="italic">a refutation is a negation, which is why a vocabulary without it can only accumulate</text>
<line x1="180" y1="1058" x2="2220" y2="1058" stroke="#ececea" stroke-width="1.5"/>
<text x="180" y="1116" font-size="27" fill="#1a1a1a" font-weight="600">Symmetry decides whether an arrangement is a new thing.</text>
<text x="180" y="1152" font-size="23" fill="#454545">Under a symmetric bond, k operands have k! spellings and one term, so a code that charges for the sequence overcharges by log&#8322;(k!) while</text>
<text x="180" y="1182" font-size="23" fill="#454545">the bond term undercharges. Both wrong, in opposite directions, and only one is usually noticed. Under an ordered bond, different orders</text>
<text x="180" y="1212" font-size="23" fill="#454545">are different terms, and charging for the sequence is correct.</text>
<text x="180" y="1276" font-size="27" fill="#1a1a1a" font-weight="600">A bond costs what it could have been.</text>
<text x="180" y="1312" font-size="23" fill="#454545">The price of an arrangement is the choice it records, so it is logarithmic in the number of bonds available:</text>
<text x="180" y="1356" font-size="26" fill="#1a1a1a">|φ|  =  (k+1) &#183; log&#8322;(|atoms|+1)  +  (k&#8722;1) &#183; log&#8322;(|bonds|)</text>
<text x="180" y="1400" font-size="23" fill="#454545">With one bond type the second term is zero, and it rises as the vocabulary of bonds grows, and only then. A bond that costs nothing is a</text>
<text x="180" y="1430" font-size="23" fill="#454545">bond that carries nothing, which is the flat case.</text>
<text x="180" y="1490" font-size="19" fill="#8a8a80">Seven tests separate the eight named here. Whether there are more is a question no test derived from these can answer. A relation that fails all seven is not an operator you are</text>
<text x="180" y="1516" font-size="19" fill="#8a8a80">missing; it is a claim that has not been made yet.</text>

<line x1="200" y1="1548" x2="2200" y2="1548" stroke="#c9c9c0" stroke-width="2"/>
<text x="200" y="1594" font-size="26" fill="#1a1a1a" font-weight="700">AMENDMENT &#183; negation is the one operator here that acts on a single operand.</text>
<text x="200" y="1638" font-size="22" fill="#454545" font-weight="400">Seven of the eight are bonds: they join two operands, and both the symmetry column and the tests are questions about how two things join. Negation joins nothing,</text>
<text x="200" y="1669" font-size="22" fill="#454545" font-weight="400">so its symmetry entry is empty rather than no, and its test asks about the operand it has rather than about an arrangement.</text>
<text x="200" y="1709" font-size="22" fill="#454545" font-weight="400">Subtraction is the nearest bond and is not it. &#8722; is A with B removed or absent, which is the absence of an operand. Negation is the refusal of a claim. A vocabulary with</text>
<text x="200" y="1740" font-size="22" fill="#454545" font-weight="400">&#8722; and without &#172; can say what is missing from an arrangement and cannot say that an arrangement is wrong, so it can only ever accumulate.</text>
<text x="200" y="1780" font-size="22" fill="#454545" font-weight="400">And &#8801; has no complement. The symmetric bonds are + &#8741; &#8801;, and identity has no partner meaning two names, two referents. An equivalence whose negation could not be written</text>
<text x="200" y="1811" font-size="22" fill="#454545" font-weight="400">was the same gap seen from inside the table, and &#172; closes it.</text>
<text x="200" y="1855" font-size="20" fill="#8a8a80" font-weight="400">The price is unchanged. |bonds| in the formula above is the choice among ways to join k operands, and negation is not one of them, so it does not enter that count. What a unary</text>
<text x="200" y="1885" font-size="20" fill="#8a8a80" font-weight="400">operator costs is open: an atom slot, nothing, or the choice of what to negate.</text>
<text x="200" y="2056" font-size="24" fill="#8a2a1e" font-weight="700">OPEN ITEM &#183; two of the bonds carry a second sense the corpus and the code do not agree on, recorded against &#8741; and &#8801;.</text>
<text x="200" y="2094" font-size="22" fill="#454545" font-weight="400">An unresolved disagreement about what two of these operators mean is a visible open item and not a closing note. It sits with the amendment above, since both are questions</text>
<text x="200" y="2125" font-size="22" fill="#454545" font-weight="400">about what this set contains rather than about how its members behave.</text>
</svg>