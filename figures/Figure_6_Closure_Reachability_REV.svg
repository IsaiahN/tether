<svg xmlns="http://www.w3.org/2000/svg" width="2640" height="2640" viewBox="0 0 2640 2640" font-family="DejaVu Sans" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="2640" height="2018" fill="#ffffff"/>
<text x="200" y="62" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="3.5">FIGURE 6</text>
<text x="200" y="120" font-size="46" fill="#111111" font-weight="700">Closure and Reachability: What Moves the Wall</text>
<text x="200" y="164" font-size="25" fill="#5f5f5f">Why composition cannot escape its own library, and what can.</text>
<line x1="200" y1="196" x2="2440" y2="196" stroke="#111111" stroke-width="3"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>

<circle cx="500" cy="478" r="46" fill="#fdeae6" stroke="#b03a2e" stroke-width="3.5"/>
<text x="500" y="493" text-anchor="middle" font-size="34" fill="#8f2f24">&#966;*</text>
<rect x="170" y="570" width="660" height="450" rx="26" fill="#f2f0e8" stroke="#8a8a80" stroke-width="3"/>
<text x="500" y="644" text-anchor="middle" font-size="42" fill="#2b2b2b">closure(&#915;)</text>
<rect x="290" y="708" width="420" height="180" rx="20" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="3.5"/>
<text x="500" y="820" text-anchor="middle" font-size="42" fill="#3c3ca8">atoms(&#915;)</text>
<text x="500" y="962" text-anchor="middle" font-size="32" fill="#666666">mint moves only in here</text>
<text x="500" y="1082" text-anchor="middle" font-size="34" fill="#8f2f24">not composable: REACHABILITY fails</text>

<rect x="965" y="402" width="730" height="180" rx="20" fill="#f2f0e8" stroke="#8a8a80" stroke-width="3"/>
<text x="1330" y="468" text-anchor="middle" font-size="42" fill="#2b2b2b">external source</text>
<text x="1330" y="524" text-anchor="middle" font-size="34" fill="#666666">nature &#183; corpus &#183; peer frame</text>
<path d="M 1330 590 L 1330 668" stroke="#1a1a1a" stroke-width="4" marker-end="url(#a)"/>
<rect x="965" y="676" width="730" height="344" rx="20" fill="#f2f0e8" stroke="#8a8a80" stroke-width="3"/>
<text x="1330" y="742" text-anchor="middle" font-size="42" fill="#2b2b2b">IMPORT</text>
<rect x="1010" y="776" width="640" height="86" rx="14" fill="#e9e6dc" stroke="#a8a49a" stroke-width="2.5"/>
<text x="1330" y="832" text-anchor="middle" font-size="34" fill="#2b2b2b">source gate: provenance</text>
<rect x="1010" y="884" width="640" height="86" rx="14" fill="#e9e6dc" stroke="#a8a49a" stroke-width="2.5"/>
<text x="1330" y="940" text-anchor="middle" font-size="34" fill="#2b2b2b">shadow test: explains a gap</text>
<text x="1330" y="1082" text-anchor="middle" font-size="34" fill="#666666">the only operator that moves the wall</text>
<path d="M 862 794 L 950 794" stroke="#1a1a1a" stroke-width="4" marker-end="url(#a)"/>
<path d="M 1712 794 L 1800 794" stroke="#1a1a1a" stroke-width="4" marker-end="url(#a)"/>

<rect x="1820" y="402" width="680" height="618" rx="26" fill="#f2f0e8" stroke="#8a8a80" stroke-width="3"/>
<text x="2160" y="472" text-anchor="middle" font-size="42" fill="#2b2b2b">closure(&#915;): expanded</text>
<circle cx="2160" cy="572" r="46" fill="#dbf3e8" stroke="#1a7f5a" stroke-width="3.5"/>
<text x="2160" y="587" text-anchor="middle" font-size="34" fill="#12664a">&#966;*</text>
<rect x="1900" y="696" width="520" height="180" rx="20" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="3.5"/>
<text x="2160" y="766" text-anchor="middle" font-size="40" fill="#3c3ca8">atoms(&#915;) + one</text>
<text x="2160" y="820" text-anchor="middle" font-size="34" fill="#5b5bd6">the imported primitive</text>
<text x="2160" y="962" text-anchor="middle" font-size="32" fill="#666666">mint can now reach &#966;*</text>
<text x="2160" y="1082" text-anchor="middle" font-size="34" fill="#12664a">closure expands; &#966;* now reachable</text>



<line x1="200" y1="1184" x2="2440" y2="1184" stroke="#dcdcdc" stroke-width="2"/>
<text x="200" y="1236" font-size="28" fill="#1a1a1a" font-weight="700">MINT composes inside the closure and can never add an atom.</text>
<text x="200" y="1270" font-size="22" fill="#454545" font-weight="400">NOVEL means novel relative to atoms, not to the world. IMPORT adds an atom, and the added atom is what expands the closure.</text>
<text x="240" y="1306" font-size="23" fill="#2b2b2b" font-weight="400" font-style="italic">No frame escapes its own closure. The bound moves only on contact with a frame whose closure differs.</text>
<rect x="210" y="1287" width="4" height="29" rx="2" fill="#c8c8c8"/>
<text x="200" y="1340" font-size="22" fill="#454545" font-weight="400">Import from a live peer is debited against that frame&#8217;s independence. A wrong atom costs more than starting from primitives.</text>
<text x="200" y="1406" font-size="23" fill="#1a1a1a" font-weight="600">An import adds no atom to the world.</text>
<text x="200" y="1440" font-size="22" fill="#454545" font-weight="400">The world does not gain primitives; a frame gains access. Composition explores what the operators reach; instruments extend what can be represented at all.</text>
<text x="200" y="1474" font-size="22" fill="#1a1a1a" font-weight="600">Which is why some unreachability is depth and some is genuine absence, and from inside the frame the two look the same.</text>
<text x="200" y="1540" font-size="23" fill="#1a1a1a" font-weight="600">Which makes reachability two questions, not one. The instruments are opposed.</text>
<text x="244" y="1574" font-size="22" fill="#454545" font-weight="400">inward: is our representation adequate to hold it? The instrument extends access. Fails by refining forever on an axis that cannot carry it. Sharpen in our own terms.</text>
<circle cx="220" cy="1567" r="4.5" fill="#8a8a80"/>
<text x="244" y="1608" font-size="22" fill="#454545" font-weight="400">outward: does another frame already hold it? The description travels. Fails by being sharpened into terms only we can read. Cast it in effect terms.</text>
<circle cx="220" cy="1601" r="4.5" fill="#8a8a80"/>
<text x="200" y="1642" font-size="22" fill="#1a1a1a" font-weight="600">Neither answer tells you much about the other. Run them as two tracks, and never read one against the other.</text>
<text x="200" y="1708" font-size="23" fill="#1a1a1a" font-weight="600">An instrument is not built from a description. It is improved from a worse instrument already returning something.</text>
<text x="200" y="1742" font-size="22" fill="#454545" font-weight="400">Nobody specified a telescope from an account of Mars. A wandering point in the sky was already a reading, and every sharper instrument was built on the residual the last one produced.</text>
<text x="240" y="1778" font-size="23" fill="#2b2b2b" font-weight="400" font-style="italic">The question is not whether a sensor could exist. It is whether anything, at any resolution, is already returning something that fails to resolve. Where nothing is, there is no edge to</text>
<text x="240" y="1810" font-size="23" fill="#2b2b2b" font-weight="400" font-style="italic">extend from, and the search for a proto-instrument is a search for one that is already there.</text>
<rect x="210" y="1759" width="4" height="61" rx="2" fill="#c8c8c8"/>
<text x="200" y="1840" font-size="23" fill="#1a1a1a" font-weight="600">What this rule does not say</text>
<text x="200" y="1874" font-size="22" fill="#454545" font-weight="400">It tells a question that nothing could ever answer apart from one that is merely hard. It is not a rule about theory.</text>
<text x="244" y="1908" font-size="22" fill="#454545" font-weight="400">theory routinely precedes its instrument, and is welcome to. Neptune was calculated before it was seen, and the prediction is what told anyone where to point</text>
<circle cx="220" cy="1901" r="4.5" fill="#8a8a80"/>
<text x="244" y="1942" font-size="22" fill="#454545" font-weight="400">instruments do not have to improve by small steps. A jump in resolution is fine</text>
<circle cx="220" cy="1935" r="4.5" fill="#8a8a80"/>
<text x="200" y="1976" font-size="22" fill="#1a1a1a" font-weight="600">What is unavailable is a sensor for something that has never registered anywhere, at any resolution. That is the whole of it.</text>

<line x1="200" y1="2000" x2="2440" y2="2000" stroke="#c9c9c0" stroke-width="2"/>
<text x="200" y="2046" font-size="26" fill="#1a1a1a" font-weight="700">AMENDMENT &#183; the wall moves outward on import. It also moves inward, and this figure is silent on that.</text>
<text x="200" y="2090" font-size="22" fill="#454545" font-weight="400">What is recorded only grows. What is reachable is derived, and it can fall. A refutation adds a term that refuses; it removes nothing, and the reach falls because</text>
<text x="200" y="2121" font-size="22" fill="#454545" font-weight="400">something was added rather than because anything was deleted. So the closure and the reach are two quantities: one monotone, one not.</text>
<text x="200" y="2161" font-size="22" fill="#454545" font-weight="400">Which is what makes the fall safe to compute. A term is reachable if it is derivable under everything currently held, so what happens to terms built on a refuted one</text>
<text x="200" y="2192" font-size="22" fill="#454545" font-weight="400">follows from derivation rather than being stipulated. And a term cannot cycle in and out, because the refusal never leaves the record: it becomes reachable again only</text>
<text x="200" y="2223" font-size="22" fill="#454545" font-weight="400">if something new is minted, which is growth. A store that deleted instead would have neither property, and could not tell never-held from held-and-given-up.</text>
<text x="200" y="2263" font-size="19" fill="#8a8a80" font-weight="400">Open. If a term and its refusal are both settled, the record holds a contradiction. Whether that is two scopes, an error in the ground, or a world that changed is not yet decidable here.</text>
<text x="200" y="2319" font-size="26" fill="#1a1a1a" font-weight="700">AMENDMENT &#183; reachability is two questions in this figure. There is a third, and it moves nothing.</text>
<text x="200" y="2363" font-size="22" fill="#454545" font-weight="400"><tspan font-weight="700" fill="#1a1a1a">more search at the same reach:</tspan> is it in here and unfound? The closure does not change. Same atoms, same wall, more of the space actually visited.</text>
<text x="200" y="2394" font-size="22" fill="#454545" font-weight="400">Fails by spending budget on a region already swept. Distribute the search, and keep the searchers independent.</text>
<text x="200" y="2434" font-size="22" fill="#454545" font-weight="400">Figure 8 separates underivable-in-principle from unreachable-at-this-budget. The two instruments above both answer the first. Nothing here answers the second, and importing</text>
<text x="200" y="2465" font-size="22" fill="#454545" font-weight="400">against a budget limit adds an atom that was not needed &#8212; which this figure already prices above starting from primitives.</text>
<text x="200" y="2505" font-size="22" fill="#454545" font-weight="400">And it inherits Figure 8&#8217;s condition directly: searchers drawing on the same evidence are one searcher wearing many names. Independence decides whether more of them buy more</text>
<text x="200" y="2536" font-size="22" fill="#454545" font-weight="400">search or only more spelling, which makes it the parameter rather than a caveat.</text>
<text x="200" y="2580" font-size="19" fill="#8a8a80" font-weight="400">How to read these. Both are additions rather than corrections: this figure is silent on the inward direction and on the third question, not wrong about either.</text>
</svg>