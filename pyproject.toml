[project]
name = "tether"
version = "0.7.0"
description = "Decision architecture: residual routing, gated minting, provenance. No LLM."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["grammar", "ledger", "gate", "gamma", "world", "tether", "speak", "probe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "C4", "TID"]

# THE LAYER BOUNDARY, as config rather than as code -- ruff expresses this natively and
# reimplementing it would be the reinvention no grep can see. A language-level import of
# a domain fact is a step-7 IMPORT executed by the import system instead of by the loop,
# which is why the action set cannot grow. The message is the "use this instead" note:
# it arrives at the moment of the mistake, which is the only moment it helps.
#
# THE SECOND FIREWALL, and it has no entries yet because the module it guards is unbuilt.
# The first bans GAME FACTS. This one bans HARNESS CONFIGURATION, and it is the more
# dangerous of the two BECAUSE IT SOUNDS ADMINISTRATIVE. A config value is easier to
# justify reading than a rule of the game, which is exactly what makes it easier to leak.
#
#   THE SEAT MAY READ THE HARNESS. THE AGENT MAY READ ONLY THE FRAME.
#
# MAX_ACTIONS, the import graph, function signatures, how FrameData is constructed, what
# the platform will and will not deliver -- all of it is the seat's business, and reading
# it is how we know whether a submission runs at all. NONE of it enters the library, the
# priors, the grammar, or any decision the agent makes. The agent discovers its budget by
# running out, or is told by the frame. Never by a number someone read from a config.
#
# THE RISK IS IN ENCODING, NEVER IN READING -- and it is checkable rather than trusted:
# if the agent's behaviour changes when the number changes, the number is in the agent.
# Measured 2026-08-26 on the loop's own budget, `run(cycles)`: a 40-cycle run is a
# BIT-IDENTICAL PREFIX of a 90-cycle run on all six panel worlds. The budget is not in
# the agent.
#
# Entries go in when the harness bridge exists. The ban cannot be `agents.agent.Agent`,
# because the bridge must subclass it -- it is the CONFIG the loop may not read, with the
# bridge exempted by office the way `demo.py` is.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"world.ACTIONS".msg = "the loop may not read the action set; add actions() to the Env contract and grow it through step 7"
"world.M".msg = "the loop may not read the value space; the env declares its own code -- see DECLARE THE CODE"
"world.DELTA".msg = "an action's effect is the domain's, not the loop's"
"world.RULES".msg = "the hidden rules are the ground's; the loop cannot see them"
"world._atoms".msg = "private name across a module boundary; take the atom set as an argument"
"world.TRUTH".msg = "the answer key is the harness's; only demo.py and the grader may read it"

[tool.ruff.lint.per-file-ignores]
# the harness sits OUTSIDE the loop by office: keeping the anchor reachable is a seat's
# job, and a ground maintainer that could not read the ground would be no maintainer
"demo.py" = ["TID251"]
"test_gate.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q -p no:cacheprovider"
